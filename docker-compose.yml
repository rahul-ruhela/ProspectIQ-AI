name: prospectiq

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prospectiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospectiq}
      POSTGRES_DB: ${POSTGRES_DB:-prospectiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospectiq} -d ${POSTGRES_DB:-prospectiq}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prospectiq-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: prospectiq-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospectiq}:${POSTGRES_PASSWORD:-prospectiq}@postgres:5432/${POSTGRES_DB:-prospectiq}
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seeder &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: prospectiq-worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospectiq}:${POSTGRES_PASSWORD:-prospectiq}@postgres:5432/${POSTGRES_DB:-prospectiq}
      REDIS_URL: redis://redis:6379/0
    # Research jobs are long-running and IO-bound; one process per queue keeps
    # a stuck crawl from blocking enrichment work.
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q research,enrichment,default
    # The image's HTTP probe belongs to the API; a worker answers on the broker instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 40s
      retries: 3
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  beat:
    build:
      context: ./backend
    container_name: prospectiq-beat
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospectiq}:${POSTGRES_PASSWORD:-prospectiq}@postgres:5432/${POSTGRES_DB:-prospectiq}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    # Beat only publishes to the broker; there is nothing meaningful to probe.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  flower:
    build:
      context: ./backend
    container_name: prospectiq-flower
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app.celery_app flower --port=5555
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5555/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  # The production-style static build. `npm run dev` serves the same app on 5173
  # with hot reload, so this publishes elsewhere to keep both usable at once.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: prospectiq-frontend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
